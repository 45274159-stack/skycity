<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E☁️%3C/text%3E%3C/svg%3E"><title>空中之城</title><link rel="stylesheet" href="style.css"></head><body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div class="panel stats">
  <div class="row"><span class="ico">🪙</span><b id="coins">0</b></div>
  <div class="mini"><span>🪵 <b id="wood">0</b></span><span>🪨 <b id="stone">0</b></span><span>🌱 <b id="seeds">0</b></span></div>
  <div class="bar"><i>☺</i><div><span id="mood"></span></div><em>心情</em></div>
  <div class="bar"><i>☀</i><div class="b2"><span id="dayb"></span></div><em id="day">第1天</em></div>
</div>
<div class="panel quest"><div class="qt">🚩 任务 <span id="qn">1/8</span></div><div id="qtext"></div></div>
<div class="corner"><button class="rbtn" id="shopBtn" title="小铺">🏪</button><button class="rbtn" id="mute" title="音乐">🔈</button><button class="rbtn" id="reset" title="重新开始">↺</button></div>
<div class="panel tool"><div class="tl">当前工具</div><div class="tn"><span id="tIcon">⛏️</span><b id="tName">锄头</b></div><div class="tl" id="tDesc"></div></div>
<div class="panel hotbar" id="hotbar"></div>
<div class="panel keys"><span><kbd>WASD</kbd>移动</span><span><kbd>空格</kbd>使用</span><span><kbd>1-6</kbd>工具</span><span><kbd>点击</kbd>前往</span><span><kbd>Esc</kbd>关闭</span></div>
<div id="joy"><div id="knob"></div></div>
<button id="actBtn">使用</button>
<div id="toast"></div>
<div id="shop"><div class="panel spanel" role="dialog" aria-label="云端小铺">
 <div class="hd"><span class="ti">🏪 云端小铺</span><div class="tabs"><button class="tab on" data-tab="seed">🌱 种子</button><button class="tab" data-tab="deco">🌼 装饰</button></div><span class="coin" id="shopCoin">🪙 0</span><button class="x" id="shopX" aria-label="关闭">✕</button></div>
 <div class="body" id="shopBody"></div>
 <div class="ft"><span id="shopRes"></span><span class="hint">买错了也没关系：未摆放或 60 秒内可原价退货</span></div>
</div></div>
<div class="panel" id="placeBar"><span id="placeName">摆放</span><small>绿色可放 · 空格/使用 确认 · Esc 取消</small><button class="btn" id="placeOk">放这里</button><button class="x" id="placeX" aria-label="取消">✕</button></div>
<div id="ask"><div class="panel abox"><div id="askT"></div><div class="abtn"><button class="btn" id="askY">好呀</button><button class="btn ghost" id="askN">不用了</button></div></div></div>
<script type="module" src="game.js"></script></body></html>
